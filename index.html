<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAN Chat</title>
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: auto;
    padding: 20px;
    background: #f0f2f5;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

h2 {
    margin-bottom: 10px;
    color: #333;
}

#status {
    font-size: 13px;
    margin-bottom: 8px;
    padding: 4px 10px;
    border-radius: 20px;
    display: inline-block;
    background: #ffd700;
    color: #333;
    font-weight: bold;
}
#status.connected  { background: #4caf50; color: white; }
#status.disconnected { background: #f44336; color: white; }

#messages {
    flex: 1;
    height: 450px;
    border: 1px solid #ccc;
    border-radius: 10px;
    overflow-y: auto;
    padding: 12px;
    margin-bottom: 10px;
    background: white;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.message {
    max-width: 75%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
}

.message .time {
    font-size: 10px;
    opacity: 0.6;
    margin-top: 3px;
    display: block;
}

.you {
    background: #dcf8c6;
    align-self: flex-end;
    border-bottom-right-radius: 3px;
}

.friend {
    background: #e8e8e8;
    align-self: flex-start;
    border-bottom-left-radius: 3px;
}

.system {
    align-self: center;
    background: transparent;
    color: #888;
    font-size: 12px;
    font-style: italic;
}

#inputArea {
    display: flex;
    gap: 10px;
}

#messageInput {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 24px;
    font-size: 14px;
    outline: none;
}
#messageInput:focus { border-color: #4caf50; }

#sendBtn {
    padding: 10px 22px;
    background: #4caf50;
    color: white;
    border: none;
    border-radius: 24px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}
#sendBtn:hover { background: #43a047; }

#clearBtn {
    padding: 10px 14px;
    background: #eee;
    border: none;
    border-radius: 24px;
    cursor: pointer;
    font-size: 13px;
    color: #888;
}
#clearBtn:hover { background: #ddd; }

</style>
</head>

<body>

<h2>WAN Chat</h2>
<span id="status">Connecting...</span>

<div id="messages"></div>

<div id="inputArea">
    <input id="messageInput" placeholder="Type message..." autocomplete="off">
    <button id="clearBtn" onclick="clearHistory()">Clear</button>
    <button id="sendBtn" onclick="sendMessage()">Send</button>
</div>

<script>

const messagesDiv = document.getElementById("messages");
const statusEl    = document.getElementById("status");
const STORAGE_KEY = "wan_chat_history";
const WS_URL      = "wss://wan-data-t.onrender.com/ws";

// ─── Load previous messages from localStorage ───
function loadHistory() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;
    try {
        const history = JSON.parse(saved);
        history.forEach(m => renderMessage(m.type, m.text, m.time, false));
    } catch(e) {
        localStorage.removeItem(STORAGE_KEY);
    }
}

// ─── Save message to localStorage ───
function saveMessage(type, text, time) {
    const saved = localStorage.getItem(STORAGE_KEY);
    const history = saved ? JSON.parse(saved) : [];
    history.push({ type, text, time });
    // Keep only the last 200 messages (more can slow things down)
    if (history.length > 200) history.splice(0, history.length - 200);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

// ─── Render message in the DOM ───
function renderMessage(type, text, time, save=true) {
    const div = document.createElement("div");
    div.className = "message " + type;

    if (type === "system") {
        div.textContent = text;
    } else {
        const label = type === "you" ? "You" : "Friend";
        div.innerHTML = `<b>${label}:</b> ${escapeHtml(text)}
            <span class="time">${time}</span>`;
    }

    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    if (save && type !== "system") {
        saveMessage(type, text, time);
    }
}

function escapeHtml(text) {
    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

function getTime() {
    return new Date().toLocaleTimeString("en-IN", {hour:"2-digit", minute:"2-digit"});
}

function clearHistory() {
    localStorage.removeItem(STORAGE_KEY);
    messagesDiv.innerHTML = "";
    renderMessage("system", "Chat cleared.", getTime(), false);
}

// ─── WebSocket with auto-reconnect ───
let socket;
let reconnectTimer;

function connect() {
    statusEl.textContent   = "Connecting...";
    statusEl.className     = "";

    socket = new WebSocket(WS_URL);

    socket.onopen = () => {
        statusEl.textContent = "Connected ✓";
        statusEl.className   = "connected";
        clearTimeout(reconnectTimer);
        renderMessage("system", "Connected to server.", getTime(), false);
    };

    socket.onmessage = (event) => {
        renderMessage("friend", event.data, getTime());
    };

    socket.onclose = () => {
        statusEl.textContent = "Disconnected — reconnecting...";
        statusEl.className   = "disconnected";
        renderMessage("system", "Disconnected. Reconnecting in 3s...", getTime(), false);
        // Reconnect after 3 seconds
        reconnectTimer = setTimeout(connect, 3000);
    };

    socket.onerror = () => {
        socket.close();
    };
}

function sendMessage() {
    const input = document.getElementById("messageInput");
    const text  = input.value.trim();
    if (!text) return;
    if (socket.readyState !== WebSocket.OPEN) {
        alert("Not connected yet!");
        return;
    }
    socket.send(text);
    renderMessage("you", text, getTime());
    input.value = "";
}

document.getElementById("messageInput")
    .addEventListener("keydown", function(e) {
        if (e.key === "Enter") sendMessage();
    });

// ─── Start ───
loadHistory();
connect();

</script>

</body>
</html>
