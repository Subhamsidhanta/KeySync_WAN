<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAN Chat & KeySync Console</title>

<!-- Google Fonts: Cabinet Grotesk (headings) and Plus Jakarta Sans (UI/Body) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Cabinet+Grotesk:wght@800&display=swap" rel="stylesheet">

<style>
/* CSS Reset & Tokens */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg-dark: #070913;
    --card-dark: rgba(22, 28, 45, 0.4);
    --border-color: rgba(255, 255, 255, 0.08);
    --accent-mint: #00ff87;
    --accent-mint-glow: rgba(0, 255, 135, 0.25);
    --text-primary: #f3f4f6;
    --text-secondary: #9ca3af;
    --bubble-me: #092c23;
    --bubble-me-border: rgba(0, 255, 135, 0.2);
    --bubble-them: #1f293d;
    --bubble-them-border: rgba(255, 255, 255, 0.05);
    --bubble-kb: #111827;
    --bubble-kb-border: rgba(0, 255, 135, 0.15);
    --font-sans: 'Plus Jakarta Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --font-display: 'Cabinet Grotesk', sans-serif;
}

body {
    font-family: var(--font-sans);
    background-color: var(--bg-dark);
    background-image: 
        radial-gradient(at 0% 0%, rgba(0, 255, 135, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(142, 36, 170, 0.05) 0px, transparent 50%);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

#app {
    width: 95%;
    max-width: 900px;
    height: 94vh;
    background: var(--card-dark);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* Header */
#header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border-color);
    background: rgba(15, 23, 42, 0.4);
}

#header h1 {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
}

#header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
}

/* Status Indicator */
#status {
    font-size: 11.5px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 50px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.3s ease;
}

#status::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #9ca3af;
}

#status.connected {
    color: var(--accent-mint);
    border-color: rgba(0, 255, 135, 0.3);
    background: rgba(0, 255, 135, 0.05);
    box-shadow: 0 0 10px rgba(0, 255, 135, 0.1);
}

#status.connected::before {
    background: var(--accent-mint);
    box-shadow: 0 0 8px var(--accent-mint);
    animation: pulse 1.8s infinite;
}

#status.disconnected {
    color: #ef4444;
    border-color: rgba(239, 68, 68, 0.3);
    background: rgba(239, 68, 68, 0.05);
}

#status.disconnected::before {
    background: #ef4444;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.5; }
    100% { transform: scale(1); opacity: 1; }
}

/* Tabs / Filters for Messages */
#filter-tabs {
    display: flex;
    gap: 8px;
    padding: 10px 24px;
    background: rgba(7, 9, 19, 0.2);
    border-bottom: 1px solid var(--border-color);
}

.tab-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.tab-btn:hover {
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.04);
}

.tab-btn.active {
    color: var(--accent-mint);
    background: rgba(0, 255, 135, 0.06);
    border-color: rgba(0, 255, 135, 0.15);
}

/* Messages Area */
#messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: rgba(10, 13, 27, 0.1);
}

/* Custom Scrollbar */
#messages::-webkit-scrollbar {
    width: 6px;
}
#messages::-webkit-scrollbar-track {
    background: transparent;
}
#messages::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
}
#messages::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.2);
}

/* Bubbles Wrapper & Alignment */
.bubble-wrap {
    display: flex;
    flex-direction: column;
    max-width: 75%;
    animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

.bubble-wrap.me {
    align-self: flex-end;
    align-items: flex-end;
}

.bubble-wrap.them {
    align-self: flex-start;
    align-items: flex-start;
}

/* Sender Name and Custom Styling */
.sender-name {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 5px;
    padding-left: 4px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
}

.sender-name:hover {
    filter: brightness(1.2);
}

.sender-name .edit-hint {
    font-size: 10px;
    font-weight: 500;
    opacity: 0;
    color: var(--text-secondary);
    transition: opacity 0.2s ease;
}

.sender-name:hover .edit-hint {
    opacity: 1;
}

/* The Bubble itself */
.bubble {
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.5;
    word-break: break-word;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    border: 1px solid transparent;
}

.bubble-wrap.me .bubble {
    background: var(--bubble-me);
    border-color: var(--bubble-me-border);
    color: #e6fcf5;
    border-bottom-right-radius: 4px;
}

.bubble-wrap.them .bubble {
    background: var(--bubble-them);
    border-color: var(--bubble-them-border);
    color: var(--text-primary);
    border-bottom-left-radius: 4px;
}

.bubble .time {
    font-size: 10px;
    color: var(--text-secondary);
    display: block;
    margin-top: 5px;
    text-align: right;
}

.bubble-wrap.me .bubble .time {
    color: #5bb28e;
}

/* Specialized Keyboard Keycap Styling */
.bubble-wrap.keyboard-stream {
    max-width: 90%;
    align-self: flex-start;
}

.bubble-wrap.keyboard-stream .bubble {
    background: var(--bubble-kb);
    border-color: var(--bubble-kb-border);
    color: var(--accent-mint);
    font-family: var(--font-mono);
    font-size: 13.5px;
    padding: 10px 14px;
}

.keycap {
    display: inline-block;
    background: #242b3d;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-bottom: 2px solid rgba(255, 255, 255, 0.25);
    color: var(--text-primary);
    border-radius: 5px;
    padding: 1px 6px;
    margin: 1px 2px;
    font-size: 11px;
    font-weight: 700;
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
}

.system-msg {
    align-self: center;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 500;
    padding: 5px 16px;
    border-radius: 50px;
    margin: 6px 0;
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
}

/* Input Area styling */
#inputArea {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 24px;
    border-top: 1px solid var(--border-color);
    background: rgba(15, 23, 42, 0.3);
}

#messageInput {
    flex: 1;
    padding: 14px 20px;
    border: 1px solid var(--border-color);
    border-radius: 16px;
    background: rgba(10, 13, 27, 0.4);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 14.5px;
    outline: none;
    transition: all 0.25s ease;
}

#messageInput:focus {
    border-color: rgba(0, 255, 135, 0.4);
    background: rgba(10, 13, 27, 0.6);
    box-shadow: 0 0 14px rgba(0, 255, 135, 0.08);
}

.btn-icon {
    width: 48px;
    height: 48px;
    border-radius: 16px;
    border: 1px solid var(--border-color);
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.2s ease;
}

.btn-icon:hover {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-primary);
}

#sendBtn {
    padding: 0 24px;
    height: 48px;
    background: var(--accent-mint);
    color: #05140b;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-size: 14.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 15px rgba(0, 255, 135, 0.25);
    transition: all 0.2s ease;
}

#sendBtn:hover {
    background: #00e676;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(0, 255, 135, 0.35);
}

#sendBtn:active {
    transform: translateY(0);
}

/* Rename Toast */
#renameToast {
    position: fixed;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #111827;
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-primary);
    padding: 12px 24px;
    border-radius: 16px;
    font-size: 13.5px;
    font-weight: 600;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    z-index: 999;
}
#renameToast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* Modal Styling */
#renameModal {
    position: fixed;
    inset: 0;
    background: rgba(4, 6, 12, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}
#renameModal.hidden {
    display: none;
}
#renameBox {
    background: #111827;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 32px 28px;
    width: 380px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    animation: modalReveal 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes modalReveal {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

#renameBox h3 {
    font-family: var(--font-display);
    font-size: 20px;
    color: var(--accent-mint);
}
#renameBox p  {
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.4;
}
#renameInput {
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    color: var(--text-primary);
    font-size: 15px;
    outline: none;
    transition: all 0.2s ease;
}
#renameInput:focus {
    border-color: var(--accent-mint);
    box-shadow: 0 0 10px rgba(0, 255, 135, 0.1);
}
.modal-btns {
    display: flex;
    gap: 12px;
    margin-top: 6px;
}
.modal-btns button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
}
#renameConfirm {
    background: var(--accent-mint);
    color: #05140b;
}
#renameConfirm:hover {
    background: #00e676;
}
#renameCancel  {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-secondary);
    border: 1px solid rgba(255, 255, 255, 0.08);
}
#renameCancel:hover  {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-primary);
}

/* Login Container */
#login-container {
    position: fixed;
    inset: 0;
    background: var(--bg-dark);
    background-image: 
        radial-gradient(at 0% 0%, rgba(0, 255, 135, 0.06) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(142, 36, 170, 0.06) 0px, transparent 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    transition: opacity 0.4s ease;
}

#login-box {
    background: var(--card-dark);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    padding: 40px 32px;
    width: 90%;
    max-width: 420px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    gap: 20px;
}

#login-box h2 {
    font-family: var(--font-display);
    font-size: 24px;
    color: var(--accent-mint);
    text-align: center;
    letter-spacing: -0.5px;
}

#login-box p {
    font-size: 14px;
    color: var(--text-secondary);
    text-align: center;
    line-height: 1.5;
    margin-bottom: 8px;
}

.input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.input-group label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.input-group input {
    padding: 14px 16px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    color: var(--text-primary);
    font-size: 15px;
    outline: none;
    transition: all 0.2s ease;
}

.input-group input:focus {
    border-color: var(--accent-mint);
    box-shadow: 0 0 10px rgba(0, 255, 135, 0.1);
}

#loginBtn {
    padding: 14px;
    background: var(--accent-mint);
    color: #05140b;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 255, 135, 0.2);
    transition: all 0.2s ease;
    margin-top: 10px;
}

#loginBtn:hover {
    background: #00e676;
    box-shadow: 0 6px 20px rgba(0, 255, 135, 0.3);
}

.error-msg {
    color: #ef4444;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    min-height: 20px;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
}

.hidden {
    display: none !important;
}

@media (max-width: 640px) {
    body {
        align-items: stretch;
        justify-content: stretch;
    }
    #app {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        border: none;
    }
    #header {
        padding: 14px 16px;
    }
    #header h1 {
        font-size: 20px;
    }
    #filter-tabs {
        padding: 8px 16px;
        overflow-x: auto;
        white-space: nowrap;
        gap: 6px;
    }
    /* Hide scrollbar for filter tabs */
    #filter-tabs::-webkit-scrollbar {
        display: none;
    }
    .tab-btn {
        padding: 5px 12px;
        font-size: 12px;
    }
    #messages {
        padding: 16px;
        gap: 12px;
    }
    .bubble-wrap {
        max-width: 88%;
    }
    .bubble-wrap.keyboard-stream {
        max-width: 95%;
    }
    .bubble {
        padding: 10px 14px;
        font-size: 13.5px;
    }
    #inputArea {
        padding: 12px 16px;
        gap: 8px;
    }
    #messageInput {
        padding: 12px 16px;
        font-size: 13.5px;
        border-radius: 12px;
    }
    .btn-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        font-size: 16px;
    }
    #sendBtn {
        height: 42px;
        padding: 0 16px;
        border-radius: 12px;
        font-size: 13.5px;
    }
    #login-box {
        padding: 30px 20px;
        border-radius: 20px;
        gap: 16px;
    }
    #login-box h2 {
        font-size: 22px;
    }
    #login-box p {
        font-size: 13px;
    }
    .input-group input {
        padding: 12px;
        font-size: 14px;
    }
    #loginBtn {
        padding: 12px;
        font-size: 14px;
        margin-top: 4px;
    }
}
</style>
</head>
<body>

<!-- Login Overlay -->
<div id="login-container" class="hidden">
    <div id="login-box">
        <h2>🔒 Authentication</h2>
        <p>Enter credentials to access WAN Chat & KeySync Console.</p>
        <div class="input-group">
            <label for="usernameInput">Username</label>
            <input id="usernameInput" type="text" placeholder="Enter username..." autocomplete="off">
        </div>
        <div class="input-group">
            <label for="passwordInput">Password</label>
            <input id="passwordInput" type="password" placeholder="Enter password..." autocomplete="off">
        </div>
        <div id="loginError" class="error-msg"></div>
        <button id="loginBtn" onclick="tryLogin()">Log In</button>
    </div>
</div>

<!-- Rename Modal -->
<div id="renameModal" class="hidden">
    <div id="renameBox">
        <h3 id="renameTitle">✏️ নাম পরিবর্তন করো</h3>
        <p id="renameDesc">এই sender এর নাম দাও — পরের সব message এ automatically এই নামেই আসবে।</p>
        <input id="renameInput" type="text" placeholder="নাম লেখো..." maxlength="24" autocomplete="off">
        <div class="modal-btns">
            <button id="renameCancel" onclick="closeRename()">বাতিল</button>
            <button id="renameConfirm" onclick="confirmRename()">Save করো ✓</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="renameToast"></div>

<!-- App -->
<div id="app" class="hidden">
    <div id="header">
        <h1><span>💬</span> WAN Chat & KeySync</h1>
        <div id="header-actions">
            <span id="status">Connecting...</span>
        </div>
    </div>

    <!-- Filters/Tabs -->
    <div id="filter-tabs">
        <button id="tab-all" class="tab-btn active" onclick="setFilter('all')">All Streams</button>
        <button id="tab-chat" class="tab-btn" onclick="setFilter('chat')">Chat Only</button>
        <button id="tab-keys" class="tab-btn" onclick="setFilter('keys')">Keystrokes Only</button>
    </div>

    <div id="messages"></div>

    <div id="inputArea">
        <button id="clearBtn" class="btn-icon" onclick="clearHistory()" title="History মুছো">🗑</button>
        <input id="messageInput" placeholder="Message লেখো..." autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()">
            Send 
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>
</div>

<script>

// ─────────────────────────────────────
// Config
// ─────────────────────────────────────
const WS_URL       = "wss://wan-data-t.onrender.com/ws";
const STORAGE_KEY  = "wan_chat_v3";  // Upgraded namespace for fresh state
const NAMES_KEY    = "wan_sender_names_v2";
const MY_SID_KEY   = "wan_my_sid_v2";

// Active filter stream type
let activeFilter = 'all';

// ─────────────────────────────────────
// My Session ID
// ─────────────────────────────────────
let mySid = localStorage.getItem(MY_SID_KEY);
if (!mySid) {
    mySid = Math.random().toString(36).slice(2, 8).toUpperCase();
    localStorage.setItem(MY_SID_KEY, mySid);
}

// ─────────────────────────────────────
// Sender name mapping: sid → display name
// ─────────────────────────────────────
let senderNames = {};
try {
    senderNames = JSON.parse(localStorage.getItem(NAMES_KEY)) || {};
} catch(e) { senderNames = {}; }

function saveSenderNames() {
    localStorage.setItem(NAMES_KEY, JSON.stringify(senderNames));
}

let friendCounter = Object.keys(senderNames).filter(k => k !== mySid).length;

function getDisplayName(sid) {
    if (sid === mySid) return "তুমি";
    if (sid === "__keyboard__") return "📟 KeySync Monitor";
    if (senderNames[sid]) return senderNames[sid];
    
    friendCounter++;
    senderNames[sid] = `Friend ${friendCounter}`;
    saveSenderNames();
    return senderNames[sid];
}

// ─────────────────────────────────────
// Colors per SID
// ─────────────────────────────────────
const COLORS = [
    "#38bdf8", // Sky blue
    "#c084fc", // Purple
    "#fb7185", // Pink
    "#fb923c", // Orange
    "#2dd4bf", // Teal
    "#a3e635", // Lime
    "#34d399", // Emerald
    "#f472b6"  // Hot pink
];
const sidColors = {};
let cidx = 0;

function getColor(sid) {
    if (sid === "__keyboard__") return "var(--accent-mint)";
    if (!sidColors[sid]) {
        sidColors[sid] = COLORS[cidx % COLORS.length];
        cidx++;
    }
    return sidColors[sid];
}

// ─────────────────────────────────────
// Rename Modal
// ─────────────────────────────────────
let renamingSid = null;

function openRename(sid) {
    if (sid === "__keyboard__") return; // cannot rename the logger stream itself
    renamingSid = sid;
    const current = senderNames[sid] || "";
    document.getElementById("renameInput").value = current;
    document.getElementById("renameDesc").textContent =
        `"${current}" এর নাম পরিবর্তন করো। পরের সব message এ automatically এই নামে দেখাবে।`;
    document.getElementById("renameModal").classList.remove("hidden");
    setTimeout(() => {
        const inp = document.getElementById("renameInput");
        inp.focus();
        inp.select();
    }, 80);
}

function closeRename() {
    document.getElementById("renameModal").classList.add("hidden");
    renamingSid = null;
}

function confirmRename() {
    const newName = document.getElementById("renameInput").value.trim();
    if (!newName || !renamingSid) return;

    const oldName = senderNames[renamingSid] || renamingSid;
    senderNames[renamingSid] = newName;
    saveSenderNames();

    // DOM Update
    document.querySelectorAll(`.sender-name[data-sid="${renamingSid}"]`)
        .forEach(el => {
            el.childNodes[0].nodeValue = newName + " ";
        });

    closeRename();
    showToast(`✓ "${oldName}" → "${newName}" নামে save হয়েছে`);
}

document.getElementById("renameInput").addEventListener("keydown", e => {
    if (e.key === "Enter") confirmRename();
    if (e.key === "Escape") closeRename();
});

// ─────────────────────────────────────
// Toast
// ─────────────────────────────────────
let toastTimer;
function showToast(msg) {
    const t = document.getElementById("renameToast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}

// ─────────────────────────────────────
// Keycap formatter helper for KeySync
// ─────────────────────────────────────
function formatKeycaps(text) {
    // Escapes first
    let escaped = escapeHtml(text);
    
    // Detect bracketed keys like [Enter], [Backspace], [Ctrl+A] and wrap them in keycap spans
    return escaped.replace(/\[([^\]]+)\]/g, (match, keyName) => {
        return `<span class="keycap">${keyName}</span>`;
    });
}

// Filter utility
function setFilter(type) {
    activeFilter = type;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`tab-${type}`).classList.add('active');
    
    // Re-evaluate DOM visibility of current elements
    const elements = document.getElementById("messages").children;
    for (let el of elements) {
        if (el.classList.contains('system-msg')) continue;
        
        const isKb = el.classList.contains('keyboard-stream');
        if (activeFilter === 'all') {
            el.style.display = 'flex';
        } else if (activeFilter === 'chat' && !isKb) {
            el.style.display = 'flex';
        } else if (activeFilter === 'keys' && isKb) {
            el.style.display = 'flex';
        } else {
            el.style.display = 'none';
        }
    }
}

// ─────────────────────────────────────
// Render bubble
// ─────────────────────────────────────
function renderBubble(sid, msgText, time, save=true) {
    const isMe = (sid === mySid);
    const isKb = (sid === "__keyboard__");
    const name  = getDisplayName(sid);
    const color = getColor(sid);
    const messagesDiv = document.getElementById("messages");

    const wrap = document.createElement("div");
    
    // Assign stream type classes
    if (isKb) {
        wrap.className = "bubble-wrap keyboard-stream";
    } else {
        wrap.className = "bubble-wrap " + (isMe ? "me" : "them");
    }

    // Apply active filter display status immediately
    if (activeFilter === 'chat' && isKb) {
        wrap.style.display = 'none';
    } else if (activeFilter === 'keys' && !isKb) {
        wrap.style.display = 'none';
    }

    if (!isMe) {
        const nameEl = document.createElement("div");
        nameEl.className = "sender-name";
        nameEl.setAttribute("data-sid", sid);
        nameEl.style.color = color;
        
        nameEl.appendChild(document.createTextNode(name + " "));
        
        if (!isKb) {
            nameEl.title = "Click করে নাম পরিবর্তন করো";
            const hint = document.createElement("span");
            hint.className = "edit-hint";
            hint.textContent = "(✏️ rename)";
            nameEl.appendChild(hint);
            nameEl.addEventListener("click", () => openRename(sid));
        }
        wrap.appendChild(nameEl);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    
    if (isKb) {
        bubble.innerHTML = formatKeycaps(msgText) + `<span class="time">${time}</span>`;
    } else {
        bubble.innerHTML = escapeHtml(msgText) + `<span class="time">${time}${isMe ? " ✓" : ""}</span>`;
    }
    
    wrap.appendChild(bubble);
    messagesDiv.appendChild(wrap);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    if (save) saveMsg(sid, msgText, time);
}

function renderSystem(text) {
    const el = document.createElement("div");
    el.className = "system-msg";
    el.textContent = text;
    document.getElementById("messages").appendChild(el);
    document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
}

// Escapes HTML tags safely
function escapeHtml(t) {
    return String(t)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

function getTime() {
    return new Date().toLocaleTimeString("en-IN", {hour:"2-digit", minute:"2-digit"});
}

// ─────────────────────────────────────
// localStorage
// ─────────────────────────────────────
function saveMsg(sid, msg, time) {
    const saved   = localStorage.getItem(STORAGE_KEY);
    const history = saved ? JSON.parse(saved) : [];
    history.push({ sid, msg, time });
    if (history.length > 300) history.splice(0, history.length - 300);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

function loadHistory() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;
    try {
        JSON.parse(saved).forEach(m => renderBubble(m.sid, m.msg, m.time, false));
    } catch(e) {
        localStorage.removeItem(STORAGE_KEY);
    }
}

function clearHistory() {
    if (!confirm("সব message মুছে ফেলব?")) return;
    localStorage.removeItem(STORAGE_KEY);
    document.getElementById("messages").innerHTML = "";
    renderSystem("History cleared.");
}

// ─────────────────────────────────────
// WebSocket
// ─────────────────────────────────────
let socket, reconnectTimer;
const statusEl = document.getElementById("status");

function connect() {
    statusEl.textContent = "Connecting...";
    statusEl.className   = "";
    socket = new WebSocket(WS_URL);

    socket.onopen = () => {
        statusEl.textContent = "Connected ✓";
        statusEl.className   = "connected";
        clearTimeout(reconnectTimer);
        renderSystem("Connected to server successfully.");
    };

    socket.onmessage = (event) => {
        let data;
        try { data = JSON.parse(event.data); } catch(e) { data = null; }

        if (data && data.sid && data.msg !== undefined) {
            // Structured message — নিজের message ignore করো
            if (data.sid !== mySid) {
                renderBubble(data.sid, data.msg, data.time || getTime());
            }
        } else {
            // Plain text (tray.py keyboard hook output)
            renderBubble("__keyboard__", event.data, getTime());
        }
    };

    socket.onclose = () => {
        statusEl.textContent = "Disconnected";
        statusEl.className   = "disconnected";
        renderSystem("Disconnected. Reconnecting in 3s...");
        reconnectTimer = setTimeout(connect, 3000);
    };

    socket.onerror = () => socket.close();
}

// ─────────────────────────────────────
// Send
// ─────────────────────────────────────
function sendMessage() {
    const input = document.getElementById("messageInput");
    const text  = input.value.trim();
    if (!text) return;
    if (socket.readyState !== WebSocket.OPEN) {
        showToast("No server connection!"); 
        return;
    }
    const time = getTime();
    socket.send(JSON.stringify({ sid: mySid, msg: text, time }));
    renderBubble(mySid, text, time);
    input.value = "";
}

document.getElementById("messageInput").addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
});

// ─────────────────────────────────────
// Authentication
// ─────────────────────────────────────
function checkAuth() {
    if (sessionStorage.getItem("wan_authenticated") === "true") {
        document.getElementById("login-container").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        connect();
    } else {
        document.getElementById("login-container").classList.remove("hidden");
        document.getElementById("app").classList.add("hidden");
        document.getElementById("usernameInput").focus();
    }
}

function tryLogin() {
    const user = document.getElementById("usernameInput").value.trim();
    const pass = document.getElementById("passwordInput").value;
    const errorEl = document.getElementById("loginError");

    if (user === "yaash sharma" && pass === "subhankar") {
        sessionStorage.setItem("wan_authenticated", "true");
        errorEl.textContent = "";

        const container = document.getElementById("login-container");
        container.style.opacity = "0";
        setTimeout(() => {
            container.classList.add("hidden");
            document.getElementById("app").classList.remove("hidden");
            connect();
        }, 300);
    } else {
        errorEl.textContent = "❌ Invalid username or password!";
        const box = document.getElementById("login-box");
        box.style.animation = "shake 0.4s ease";
        setTimeout(() => {
            box.style.animation = "";
        }, 400);
    }
}

document.getElementById("usernameInput").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("passwordInput").focus();
});
document.getElementById("passwordInput").addEventListener("keydown", e => {
    if (e.key === "Enter") tryLogin();
});

// ─────────────────────────────────────
// Init
// ─────────────────────────────────────
loadHistory();
checkAuth();

// Set default name for "তুমি"
if (!senderNames[mySid]) {
    senderNames[mySid] = "তুমি";
    saveSenderNames();
}

</script>
</body>
</html>
